name: Supabase Keep Alive

on:
  schedule:
    # Her pazar ve çarşamba 00:00 UTC'de çalışır
    - cron: '0 0 * * 0,3'
  # İsterseniz Actions sekmesinden manuel de tetikleyebilirsiniz:
  workflow_dispatch:

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          curl -s -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
               -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
               "https://yzydjjfxqdcjwljduqnx.supabase.co/rest/v1/ping?select=id&limit=1" > /dev/null
