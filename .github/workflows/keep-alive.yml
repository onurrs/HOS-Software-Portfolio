name: Supabase Keep Alive

on:
  schedule:
    - cron: '0 0 * * 1,4'

  workflow_dispatch:

jobs:
  ping-supabase:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Supabase REST API
        run: |
          curl --fail \
            --show-error \
            --silent \
            --retry 5 \
            --retry-delay 10 \
            --retry-all-errors \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            "https://yzydjjfxqdcjwljduqnx.supabase.co/rest/v1/ping?select=id&limit=1"
