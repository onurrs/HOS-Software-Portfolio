name: Supabase Keep Alive

on:
  schedule:
    # Her pazartesi ve perşembe gece 00:00 UTC'de çalışır
    - cron: '0 0 * * 1,4'
  # Actions sekmesinden manuel tetiklemeye izin verir
  workflow_dispatch:

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          curl -i \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            "https://yzydjjfxqdcjwljduqnx.supabase.co/rest/v1/ping?select=id&limit=1"
